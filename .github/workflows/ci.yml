name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Type-check, tests and coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Reads the pinned `packageManager` field (pnpm@9.15.9), so CI and the
      # nixpacks/Coolify build resolve the same pnpm.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check (tsc)
        run: pnpm run type-check

      - name: Build addon bundle
        run: pnpm run build

      - name: Worker tests (node --test)
        run: pnpm run test:worker

      - name: Unit tests with coverage (vitest)
        run: pnpm run test:coverage

      - name: Coverage line total
        if: always()
        run: node scripts/coverage-summary.mjs

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
          if-no-files-found: ignore
